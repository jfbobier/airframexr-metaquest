# Builds the AirFrameXR Quest client APK and signs it with the store release key (the secrets below).
# Run it by pushing a tag quest-v<version> or by hand (Actions > Quest release > Run workflow).
# The log prints the certificate and the job fails if it is not the one of the Meta store builds.
name: Quest release

on:
  push:
    tags: ["quest-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (e.g. quest-v1.5.1); empty = artifact only"
        required: false

permissions:
  contents: write

env:
  # SHA-256 of the store certificate (CN=AirFrameXR), same as the 1.3.1 and 1.3.10 store builds
  EXPECTED_CERT_SHA256: 77ffc3a076a26dedf88793a6e7ad97a2901218784b838c913fb2b5c628c8f4d9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b

      - name: Prepare dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo xtask prepare-deps --platform android

      - name: Build and sign the APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KEYSTORE_B64: ${{ secrets.QUEST_KEYSTORE_B64 }}
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.QUEST_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          cargo xtask build-client --release
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check the signature and name the files
        id: apk
        run: |
          APK=build/alvr_client_android/alvr_client_android.apk
          AS="$ANDROID_HOME/build-tools/34.0.0"
          "$AS/apksigner" verify --print-certs "$APK" | grep -E "DN|SHA-256"
          GOT=$("$AS/apksigner" verify --print-certs "$APK" | grep "SHA-256" | head -1 | awk '{print $NF}')
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing certificate is $GOT, expected $EXPECTED_CERT_SHA256"; exit 1
          fi
          VERSION=$("$AS/aapt" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          cp "$APK" "airframexr-quest-$VERSION.apk"
          sha256sum "airframexr-quest-$VERSION.apk" > "airframexr-quest-$VERSION.apk.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: airframexr-quest-${{ steps.apk.outputs.version }}
          path: airframexr-quest-*

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: |
          [ -n "$TAG" ] || { echo "No tag: artifact only"; exit 0; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "AirFrameXR Quest client ${{ steps.apk.outputs.version }}" --notes "Built and signed by CI."
          gh release upload "$TAG" airframexr-quest-* --clobber
